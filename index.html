<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的旅行计划</title>
<style>
:root{--bg:#f5f3ef;--card:#fff;--accent:#c1272d;--accent2:#e8a0a3;--text:#1b1b1b;--text2:#666;--border:#e0ddd5;--shadow:0 2px 8px rgba(0,0,0,.06)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}
.container{max-width:960px;margin:0 auto;padding:60px 20px 80px}
.hero{text-align:center;margin-bottom:50px}
.hero h1{font-size:36px;margin-bottom:10px}
.hero .sub{color:var(--text2);font-size:15px}
.section-title{font-size:14px;color:var(--text2);letter-spacing:2px;margin:30px 0 16px;padding-left:4px;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.trip-card{background:var(--card);border-radius:16px;padding:24px;box-shadow:var(--shadow);text-decoration:none;color:var(--text);display:block;transition:transform .2s,box-shadow .2s;border:1px solid var(--border)}
.trip-card:hover{transform:translateY(-4px);box-shadow:0 8px 24px rgba(0,0,0,.1)}
.trip-emoji{font-size:36px;margin-bottom:12px;display:block}
.trip-title{font-size:20px;font-weight:700;color:var(--accent);margin-bottom:8px}
.trip-meta{font-size:13px;color:var(--text2);margin-bottom:12px}
.trip-desc{font-size:14px;color:var(--text);line-height:1.5}
.trip-tags{margin-top:14px;display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:11px;padding:3px 10px;border-radius:12px;background:#faf7f2;color:var(--text2);border:1px solid var(--border)}
.tag-upcoming{background:#dcfce7;color:#166534;border-color:#bbf7d0}
.empty{background:var(--card);border-radius:16px;padding:40px;text-align:center;color:var(--text2);border:1px dashed var(--border)}
footer{text-align:center;color:var(--text2);font-size:12px;margin-top:60px;padding-top:20px;border-top:1px solid var(--border)}
footer a{color:var(--accent);text-decoration:none}
@media(max-width:640px){.hero h1{font-size:28px}.container{padding:40px 16px 60px}}
</style>
</head>
<body>
<div class="container">
<div class="hero">
<h1>🗾 我的旅行计划</h1>
<div class="sub">Travel Handbooks · 用 travel-handbook skill 生成</div>
</div>

<div class="section-title">即将出发</div>
<div class="grid">
<a class="trip-card" href="./kanto-2026-09/">
<span class="trip-emoji">🎌</span>
<div class="trip-title">关东 8 日情侣旅行</div>
<div class="trip-meta">2026.09.24 — 10.02 · 8 天 · 两人</div>
<div class="trip-desc">横滨 → 小田原/箱根 → 热海 → 东京 → DisneySea。含机票/酒店/交通/预算/穿搭/checklist。</div>
<div class="trip-tags">
<span class="tag tag-upcoming">即将出发</span>
<span class="tag">日本</span>
<span class="tag">休闲</span>
<span class="tag">DisneySea</span>
</div>
</a>
</div>

<div class="section-title" style="margin-top:40px">历史归档</div>
<div class="empty">暂无归档，之后每次生成的手册会自动出现在这里</div>

<footer>
Source: <a href="https://github.com/QDDse/travel-plans" target="_blank">github.com/QDDse/travel-plans</a> · Generated by travel-handbook skill
</footer>
</div>
</body>
</html>
